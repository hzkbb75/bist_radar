name: BIST 100 Ceyreklik Bilanco Motoru

on:
  workflow_dispatch: # GitHub arayüzünden manuel "Run workflow" butonu
  schedule:
    # Bilanço ayları (Mart, Mayıs, Ağustos, Kasım):
    # Her Pazartesi saat 06:00 UTC (TSİ 09:00 - Piyasa açılmadan önce)
    - cron: '0 6 * 3,5,8,11 1'

permissions:
  contents: write # Üretilen dosyaları repoya geri push edebilmek için izin

jobs:
  bilanco_taramasi:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Paket indirmelerini hızlandırmak için önbellekleme

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl

      - name: Bilanço Motorunu Çalıştır
        run: |
          python 3aylik_bilanco_tarama.py

      - name: Güncellenen Dosyaları Repoya Kaydet (Auto-Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_bilanco_bist100.csv Temel_Analiz_Omurga.xlsx
          # Sadece dosyada gerçek bir değişiklik varsa commit et
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Çeyreklik bilanço verileri güncellendi [$(date +'%d.%m.%Y')]" && git push)
