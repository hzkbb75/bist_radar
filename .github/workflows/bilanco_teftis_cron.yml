name: BIST Bilanço ve Teftiş Otonom Motoru

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai pandas yfinance

      - name: Bilanço Motorunu Çalıştır
        run: python 3aylik_bilanco_tarama.py

      - name: Yapay Zeka Teftiş Motorunu Çalıştır (GÜÇLÜ RADAR)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python teftis_motoru.py

      - name: Güncellenen Dosyaları ve Teftiş Raporlarını Kaydet (Auto-Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: Çeyreklik veriler güncellendi ve Teftiş Raporları üretildi [$(date +'%d.%m.%Y')]" || echo "Değişiklik yok"
          git push
