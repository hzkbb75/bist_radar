name: KAP Radar ve Haber Senkronizasyonu

on:
  schedule:
    # Hafta içi borsa saatlerinde (UTC+3) her 30 dakikada bir çalışır
    - cron: '*/30 7-16 * * 1-5'
  workflow_dispatch: # Manuel çalıştırma düğmesi

jobs:
  run-kap-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: KAP Radar Kodunu Çalıştır
        env:
          ONEDRIVE_SHARE_LINK: ${{ secrets.ONEDRIVE_SHARE_LINK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python kap_radar_sync.py

      - name: Üretilen kap_haberler.csv Dosyasını Depoya Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "auto: KAP haberleri güncellendi [skip ci]" || echo "Değişiklik yok"
          git push
