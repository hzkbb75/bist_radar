name: Canlı KAP Bildirim Takibi

on:
  schedule:
    # Hafta içi TSİ 09:00 - 20:00 arası her 5 dakikada bir (UTC 06:00 - 17:00)
    - cron: '*/5 6-17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  takip-et:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: KAP Takip Kodunu Çalıştır
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          ONEDRIVE_EXCEL_URL: ${{ secrets.ONEDRIVE_EXCEL_URL }}
        run: |
          python kap_takip.py

      - name: Bildirim Hafızasını Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f son_bildirimler.json ]; then
            git add son_bildirimler.json
            if git diff --staged --quiet; then
              echo "Değişiklik yok, kayıt atlandı."
            else
              git commit -m "chore: son bildirimler hafızası güncellendi [skip ci]"
              git push
            fi
          else
            echo "son_bildirimler.json henüz oluşmadı, commit adımı atlandı."
          fi
