name: Canlı KAP Bildirim Takibi

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) BIST Seans Takvimi:
    # 1) Seans Öncesi & Seans İçi (TSİ 09:30 - 18:30 / UTC 06:30 - 15:30): Her 30 dakikada bir
    - cron: '*/30 6-15 * * 1-5'
    # 2) Seans Kapanışı & Akşam Bilanço/Özel Durum Akışı (TSİ 18:45, 19:45, 20:45 / UTC 15:45, 16:45, 17:45)
    - cron: '45 15,16,17 * * 1-5'
  workflow_dispatch: # GitHub panelinden dilediğiniz an manuel 'Run workflow' yapabilmek için

permissions:
  contents: write

jobs:
  takip-et:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: KAP Takip Kodunu Çalıştır
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GOOGLE_SHEETS_CSV_URL: ${{ secrets.GOOGLE_SHEETS_CSV_URL }}
        run: |
          python kap_takip.py

      - name: Bildirim Hafızasını Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f son_bildirimler.json ]; then
            git add son_bildirimler.json
            if git diff --staged --quiet; then
              echo "Değişiklik yok, kayıt atlandı."
            else
              git commit -m "chore: son bildirimler hafızası güncellendi [skip ci]"
              git pull --rebase origin main || git pull --rebase || true
              git push
            fi
          else
            echo "son_bildirimler.json henüz oluşmadı, commit adımı atlandı."
          fi
